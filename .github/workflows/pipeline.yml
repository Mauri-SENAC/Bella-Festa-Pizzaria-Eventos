
name: Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for committed secrets
        shell: bash
        run: |
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.github \
            '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' \
            .; then
            echo "::error::Possible secret detected."
            exit 1
          fi

      - name: Check suspicious JavaScript patterns
        shell: bash
        run: |
          if grep -nE \
            'eval[[:space:]]*\(|document\.write[[:space:]]*\(|innerHTML[[:space:]]*=' \
            --include='*.js' --include='*.html' .; then
            echo "::warning::Review potentially dangerous DOM patterns."
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze JavaScript
        uses: github/codeql-action/analyze@v3
